name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths: ['korean-trainer/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: korean-trainer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: korean-trainer/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: korean-trainer/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: korean-trainer-debug-apk
          path: korean-trainer/android/app/build/outputs/apk/debug/app-debug.apk
